name: Import Private Applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare private tracker
        shell: bash
        env:
          APPLICATION_IMPORT_CSV_B64: ${{ secrets.APPLICATION_IMPORT_CSV_B64 }}
        run: |
          set -euo pipefail
          test -n "$APPLICATION_IMPORT_CSV_B64"
          printf '%s' "$APPLICATION_IMPORT_CSV_B64" | base64 --decode > "$RUNNER_TEMP/applications.csv"
      - name: Import applications
        run: node scripts/import-applications.mjs "$RUNNER_TEMP/applications.csv"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}

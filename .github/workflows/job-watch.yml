name: Greater Seattle Job Watch

on:
  schedule:
    - cron: "0 8,20 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      refresh_only:
        description: Refresh the dashboard without sending Discord alerts
        type: boolean
        default: false

concurrency:
  group: greater-seattle-job-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find new Greater Seattle roles
        run: node scripts/job-watch.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ !inputs.refresh_only && secrets.DISCORD_WEBHOOK_URL || '' }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          REFRESH_ONLY: ${{ inputs.refresh_only }}

